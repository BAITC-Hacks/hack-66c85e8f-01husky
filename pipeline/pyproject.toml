[project]
name = "pipeline"
version = "0.1.0"
description = "Meeting protocol AI pipeline: STT, diarization, voiceprint, task extraction, summary"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Heavy ML deps live here so backend can install the contract-only package.
ml = [
    "faster-whisper>=1.1",
    "pyannote.audio>=3.1",
    "speechbrain>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
