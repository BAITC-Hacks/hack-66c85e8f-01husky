services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-protocol}
      POSTGRES_USER: ${POSTGRES_USER:-protocol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-protocol}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-protocol} -d ${POSTGRES_DB:-protocol}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: backend
    env_file: .env
    command:
      - sh
      - -c
      - >-
        uv run --no-sync alembic upgrade head &&
        uv run --no-sync python -m app.seed &&
        exec uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/outbox:/app/backend/outbox
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: backend
    env_file: .env
    command: ["uv", "run", "--no-sync", "celery", "-A", "app.tasks.celery_app:celery_app", "worker", "-Q", "celery", "--loglevel=info"]
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/outbox:/app/backend/outbox
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: bot-runtime
    env_file: .env
    init: true
    shm_size: 1gb
    security_opt:
      - seccomp=./bots/runtime/seccomp_profile.json
    stop_grace_period: 60s
    environment:
      BOT_AUDIO_DEVICE: pulse:kenes.monitor
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: backend
    env_file: .env
    command: ["uv", "run", "--no-sync", "celery", "-A", "app.tasks.celery_app:celery_app", "beat", "--loglevel=info"]
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/outbox:/app/backend/outbox
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  postgres-data:
  ollama-data:
