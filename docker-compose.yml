services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-protocol}
      POSTGRES_USER: ${POSTGRES_USER:-protocol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-protocol}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-protocol} -d ${POSTGRES_DB:-protocol}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/outbox:/app/backend/outbox
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: ["uv", "run", "celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=info"]
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/outbox:/app/backend/outbox
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: ["uv", "run", "celery", "-A", "app.tasks.celery_app:celery_app", "beat", "--loglevel=info"]
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/outbox:/app/backend/outbox
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "while true; do sleep 3600; done"]

volumes:
  postgres-data:
  ollama-data:
